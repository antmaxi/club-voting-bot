services:
  bot:
    build: .
    init: true
    # Root only so docker_entrypoint.sh can chown the bind mounts. It then
    # drops to BOT_UID:BOT_GID (default 1000:1000) and clears capabilities.
    # The added caps are only what that ownership fix needs; the bot process
    # keeps none of them.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETUID
      - SETGID
      - SETPCAP
    env_file:
      - .env
    environment:
      - BOT_UID=${BOT_UID:-1000}
      - BOT_GID=${BOT_GID:-1000}
      - DB_PATH=/app/data/bookclub.db
      - PERSISTENCE_PATH=/app/data/bot_persistence
      - ACTIVITY_PATH=/app/data/last_activity.json
      # Read-only root; /tmp is the writable tmpfs. The Cursor bridge stores
      # local run state under HOME, and the agent cwd is a temp dir there too.
      - HOME=/tmp
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    restart: always
